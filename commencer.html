<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LOX — Commencer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #08080d;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      padding: 30px 20px;
    }

    .logo {
      font-size: 85px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 42px;
      margin: 0 0 15px;
    }

    .subtitle {
      color: #aaaab5;
      font-size: 19px;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .card {
      background: #15151d;
      border: 1px solid #292936;
      border-radius: 25px;
      padding: 30px 22px;
    }

    .card h2 {
      margin-top: 0;
    }

    .card p {
      color: #9999a5;
      line-height: 1.6;
    }

    .btn {
      border: none;
      background: linear-gradient(135deg, #8b5cf6, #6d3fd1);
      color: white;
      padding: 17px 45px;
      border-radius: 50px;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 10px 30px rgba(139, 92, 246, 0.25);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .back {
      display: block;
      margin-top: 25px;
      color: #9999a5;
      text-decoration: none;
    }

    .back:hover {
      color: white;
    }

    .version {
      margin-top: 30px;
      color: #555560;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">💎</div>

    <h1>Bienvenue dans LOX</h1>

    <p class="subtitle">
      Ton environnement LOX est prêt.
      <br>
      Le centre de contrôle t'attend.
    </p>

    <section class="card">

      <h2>🚀 Accéder à LOX</h2>

      <p>
        Tu vas maintenant entrer dans le
        Dashboard principal de LOX.
      </p>

      <button
        class="btn"
        onclick="ouvrirDashboard()"
      >
        Entrer dans LOX
      </button>

    </section>

    <a href="index.html" class="back">
      ← Retour à l'accueil
    </a>

    <div class="version">
      LOX V1.0
    </div>

  </main>


  <script>

    function ouvrirDashboard() {

      localStorage.setItem(
        "lox_started",
        "true"
      );

      window.location.href =
        "dashboard.html";

    }

  </script>

</body>
</html>
