<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LOX</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      background: #08080d;

      color: white;

      font-family: Arial, sans-serif;

      display: flex;

      justify-content: center;

      align-items: center;

      text-align: center;

    }

    .container {

      width: 100%;

      max-width: 600px;

      padding: 30px;

    }

    .logo {

      font-size: 95px;

      margin-bottom: 10px;

      filter:
        drop-shadow(
          0 0 25px
          rgba(139, 92, 246, 0.35)
        );

    }

    h1 {

      font-size: 62px;

      letter-spacing: 6px;

      margin: 0;

    }

    .subtitle {

      color: #aaaab5;

      font-size: 20px;

      margin: 18px 0 45px;

    }

    .btn {

      border: none;

      background:
        linear-gradient(
          135deg,
          #8b5cf6,
          #6d3fd1
        );

      color: white;

      font-size: 21px;

      font-weight: bold;

      padding: 18px 55px;

      border-radius: 50px;

      cursor: pointer;

      box-shadow:
        0 10px 35px
        rgba(139, 92, 246, 0.25);

      transition: 0.2s;

    }

    .btn:hover {

      transform: translateY(-2px);

    }

    .btn:active {

      transform: scale(0.96);

    }

    .version {

      margin-top: 40px;

      color: #4f4f5a;

      font-size: 12px;

    }

  </style>

</head>


<body>

  <main class="container">

    <div class="logo">
      💎
    </div>

    <h1>
      LOX
    </h1>

    <p class="subtitle">
      Ton univers intelligent commence ici.
    </p>

    <button
      class="btn"
      onclick="commencer()"
    >
      Commencer
    </button>

    <div class="version">
      LOX V1.0
    </div>

  </main>


  <script>

    function commencer() {

      window.location.href =
        "commencer.html";

    }

  </script>

</body>

</html>
